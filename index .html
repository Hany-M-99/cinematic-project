<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — Luxury Food Experience</title>
    <!-- استدعاء خط Cairo للعربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* التنسيقات العامة والـ CSS */
        :root {
            --bg-dark: #0b0b0b;
            --bg-card: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* شريط التنقل العلوي */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 11, 11, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .cart-icon-btn:hover {
            color: var(--gold);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--gold);
            color: var(--bg-dark);
            font-size: 0.75rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* القسم الرئيسي (Hero Section) */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 80px;
            background: linear-gradient(rgba(11,11,11,0.7), rgba(11,11,11,0.9)), url('https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
        }

        /* قسم المنتجات */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--gold);
            margin: 10px auto 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            height: 45px;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        .add-to-cart-btn {
            background-color: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }

        .add-to-cart-btn:hover {
            background-color: var(--gold);
            color: var(--bg-dark);
        }

        /* نافذة السلة الجانبية (Cart Drawer) */
        .cart-drawer {
            position: fixed;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100%;
            background-color: var(--bg-card);
            box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            z-index: 1100;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(212, 175, 55, 0.2);
        }

        .cart-drawer.open {
            left: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            color: var(--gold);
            font-size: 1.4rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-details h4 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .cart-item-details p {
            font-size: 0.85rem;
            color: var(--gold);
        }

        .remove-item {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 1rem;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background-color: #111;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background-color: var(--gold-light);
        }

        /* خلفية شفافة عند فتح السلة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1050;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 30px;
            background-color: var(--bg-card);
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <a href="#" class="logo">AURA</a>
        <div class="nav-icons">
            <button class="cart-icon-btn" id="cartBtn">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- قسم الواجهة الرئيسية -->
    <section class="hero">
        <h1>تجربة طعام فاخرة</h1>
        <p>استمتع بأرقى الأطباق المحضرة بعناية لتناسب ذوقك الرفيع.</p>
    </section>

    <!-- قسم المنتجات -->
    <div class="container">
        <h2 class="section-title">قائمة الطعام</h2>
        <div class="products-grid" id="productsGrid">
            <!-- سيتم تعبئة المنتجات تلقائياً عبر جافاسكريبت -->
        </div>
    </div>

    <!-- نافذة السلة الجانبية -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>سلة الطلبات</h2>
            <button class="close-cart" id="closeCart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <!-- المنتجات المضافة ستظهر هنا -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cartTotalPrice">0 ج.م</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">إتمام الطلب عبر واتساب</button>
        </div>
    </div>

    <!-- الخلفية الشفافة -->
    <div class="overlay" id="overlay"></div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 AURA</p>
    </footer>

    <!-- الأكواد البرمجية (JavaScript) -->
    <script>
        // بيانات المنتجات
        const products = [
            {
                id: 1,
                name: "ستيك لحم فاخر",
                price: 450,
                description: "قطعة لحم طرية مشوية على الطريقة الخاصة مع صلصة الأعشاب.",
                image: "https://images.unsplash.com/photo-1558030006-450675393462?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 2,
                name: "سلطة سيزار الملكية",
                price: 180,
                description: "خس طازج، شرائح الدجاج المشوي، جبن البارميزان مع صوص سيزار.",
                image: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 3,
                name: "برجر أورا الخاص",
                price: 320,
                description: "لحم بقري مع جبن الشيدر الذائب وخبز البريوش الطازج.",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 4,
                name: "باستا ترافل ولحم",
                price: 380,
                description: "مكرونة فوتوتشيني مع صوص الترافل الفاخر وقطع الفطر الطازج.",
                image: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?q=80&w=600&auto=format&fit=crop"
            }
        ];

        let cart = [];

        // عناصر الصفحة
        const productsGrid = document.getElementById('productsGrid');
        const cartBtn = document.getElementById('cartBtn');
        const cartDrawer = document.getElementById('cartDrawer');
        const closeCart = document.getElementById('closeCart');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartCount = document.getElementById('cartCount');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('checkoutBtn');

        // عرض المنتجات في الصفحة
        function renderProducts() {
            productsGrid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-desc">${product.description}</p>
                        <div class="product-footer">
                            <span class="product-price">${product.price} ج.م</span>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">أضف للسلة</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // إضافة منتج للسلة
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            openCartDrawer();
        }

        // تحديث محتوى وشكل السلة
        function updateCart() {
            cartCount.textContent = cart.reduce((total, item) => total + item.quantity, 0);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">السلة فارغة حالياً</p>';
                cartTotalPrice.textContent = '0 ج.م';
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        <p>${item.price} ج.م × ${item.quantity}</p>
                    </div>
                    <button class="remove-item" onclick="removeFromCart(${item.id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalPrice.textContent = ${total} ج.م;
        }

        // إزالة منتج من السلة
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // فتح وإغلاق السلة
        function openCartDrawer() {
            cartDrawer.classList.add('open');
            overlay.classList.add('active');
        }

        function closeCartDrawer() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        cartBtn.addEventListener('click', openCartDrawer);
        closeCart.addEventListener('click', closeCartDrawer);
        overlay.addEventListener('click', closeCartDrawer);

        // إرسال الطلب عبر واتساب
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('السلة فارغة، أضف بعض المنتجات أولاً.');
                return;
            }

            let message = "مرحباً، أود طلب الأطباق التالية من AURA:\n\n";
            cart.forEach(item => {
                message += - ${item.name} (العدد: ${item.quantity}) - السعر: ${item.price * item.quantity} ج.م\n;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += \nالإجمالي الكلي: ${total} ج.م;

            const encodedMessage = encodeURIComponent(message);
            // ضع رقم الواتساب الخاص بك هنا بدلاً من علامات الإكس (مع كود الدولة)
            const phoneNumber = "201000000000"; 
            
            window.open(https://wa.me/${phoneNumber}?text=${encodedMessage}, '_blank');
        });

        // تشغيل التطبيق عند تحميل الصفحة
        renderProducts();
        updateCart();
    </script>
</body>
</html>
