<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطاقة السينمائية الذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #051822; /* لون الخلفية الداكن المستخرج من الباليت */
            color: #D4C9C7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ذيل حبل النار المضيء للمؤشر */
        .fire-trail {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #AA7452;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #AA7452, 0 0 30px #7C5841, 0 0 45px #ff5722;
            z-index: 9999;
        }

        .trail-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #AA7452 0%, #7C5841 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: fadeOut 0.5s linear forwards;
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0.2); opacity: 0; }
        }

        /* الكارت الرئيسي (Glassmorphism Card) مطابق للصورة المطلوبة */
        .main-card {
            position: relative;
            width: 850px;
            height: 480px;
            background: rgba(45, 56, 62, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(124, 88, 65, 0.4);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(170, 116, 82, 0.1);
            display: flex;
            overflow: hidden;
        }

        /* القسم الأيمن في الكارت (اللمبة والإضاءة والروبوت) */
        .card-left {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            border-left: 1px solid rgba(124, 88, 65, 0.2);
        }

        /* اللمبة المنسدلة */
        .lamp {
            width: 70px;
            height: 40px;
            background: #2D383E;
            border: 2px solid #969A9E;
            border-radius: 0 0 50% 50%;
            position: relative;
            box-shadow: 0 0 25px rgba(170, 116, 82, 0.4);
            z-index: 3;
        }

        .lamp::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 22px;
            width: 22px;
            height: 25px;
            background: #969A9E;
        }

        /* مخروط النور الخالد داخل الكارت */
        .light-beam {
            position: absolute;
            top: 60px;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 320px solid rgba(170, 116, 82, 0.12);
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(170, 116, 82, 0.2));
        }

        /* الروبوت الدائري الصغير كما في الصورة */
        .robot-circle {
            position: absolute;
            bottom: 40px;
            width: 75px;
            height: 75px;
            background: #051822;
            border: 2px solid #AA7452;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(170, 116, 82, 0.5);
            z-index: 3;
        }

        .robot-eye {
            width: 10px;
            height: 14px;
            background: #D4C9C7;
            border-radius: 50%;
            box-shadow: 0 0 8px #D4C9C7;
        }

        /* القسم الأيسر في الكارت (نموذج تسجيل الدخول) */
        .card-right {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-right h2 {
            color: #AA7452;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .card-right p {
            color: #969A9E;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #969A9E;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 15px;
            background: #051822;
            border: 1px solid #2D383E;
            border-radius: 8px;
            color: #D4C9C7;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #AA7452;
            box-shadow: 0 0 8px rgba(170, 116, 82, 0.3);
        }

        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #AA7452, #7C5841);
            border: none;
            border-radius: 8px;
            color: #D4C9C7;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(170, 116, 82, 0.5);
        }

        .error-msg {
            color: #ff5722;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* واجهة المتجر المخفية التي تظهر بعد تسجيل الدخول الناجح */
        #mainStore {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 40px;
            background: #051822;
        }

        #mainStore h1 {
            color: #AA7452;
            text-align: center;
            margin-bottom: 30px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .product-card {
            background: #2D383E;
            border: 1px solid #7C5841;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .product-card h3 { color: #D4C9C7; margin-bottom: 10px; }
        .product-card p { color: #AA7452; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ذيل حبل النار للمؤشر -->
    <div class="fire-trail" id="fireTrail"></div>

    <!-- البطاقة الرئيسية -->
    <div class="main-card" id="loginCardContainer">
        <!-- القسم الأيمن (اللمبة والنور والروبوت) -->
        <div class="card-left">
            <div class="lamp"></div>
            <div class="light-beam"></div>
            <div class="robot-circle">
                <div class="robot-eye"></div>
                <div class="robot-eye"></div>
            </div>
        </div>

        <!-- القسم الأيسر (نموذج الدخول) -->
        <div class="card-right">
            <h2>Welcome Back.</h2>
            <p>أدخل بيانات الحساب لتتمكن من الدخول</p>
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" id="username" placeholder="اكتب hany">
            </div>
            
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="اكتب 12345678900">
            </div>

            <button class="sign-in-btn" onclick="handleLogin()">SIGN IN →</button>
            <div class="error-msg" id="errorMsg">البيانات غير صحيحة، حاول مجدداً!</div>
        </div>
    </div>

    <!-- واجهة المتجر الرئيسية -->
    <div id="mainStore">
        <h1>أهلاً بك يا فنان في النظام الداخلي!</h1>
        <div class="store-grid" id="productsGrid"></div>
    </div>

    <script>
        // حركة ذيل حبل النار للمؤشر
        const trail = document.getElementById('fireTrail');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = mouseX;
        let currentY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.pageX;
            mouseY = e.pageY;
            createParticle(e.pageX, e.pageY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('trail-particle');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);

            setTimeout(() => { particle.remove(); }, 500);
        }

        function animateTrail() {
            currentX += (mouseX - currentX) * 0.2;
            currentY += (mouseY - currentY) * 0.2;
            trail.style.left = currentX + 'px';
            trail.style.top = currentY + 'px';
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        // دالة التحقق من بيانات الدخول
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'hany' && pass === '12345678900') {
                document.getElementById('loginCardContainer').style.display = 'none';
                const store = document.getElementById('mainStore');
                store.style.display = 'block';

                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';
                for (let i = 1; i <= 8; i++) {
                    grid.innerHTML += `
                        <div class="product-card">
                            <h3>عنصر رقم ${i}</h3>
                            <p>$${i * 25}.00</p>
                        </div>
                    `;
                }
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
