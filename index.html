<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070713">
<meta name="description" content="متجر فضائي عصري - كريب وشاورما ومشروبات">
<title>NOVA BITES — متجر فضائي</title>

<style>
:root{
  --bg:#05050d;
  --bg2:#09091a;
  --panel:rgba(17,17,35,.72);
  --panel2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.12);
  --text:#f7f7ff;
  --muted:#a9aac4;
  --primary:#8b5cf6;
  --primary2:#c084fc;
  --cyan:#22d3ee;
  --pink:#f472b6;
  --green:#34d399;
  --yellow:#facc15;
  --danger:#fb7185;
  --shadow:0 25px 80px rgba(0,0,0,.45);
  --radius:24px;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:"Tajawal","Cairo",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(139,92,246,.22),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(34,211,238,.13),transparent 24%),
    radial-gradient(circle at 55% 85%,rgba(244,114,182,.12),transparent 30%),
    linear-gradient(145deg,#03030a,#080817 45%,#04040b);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-3;
  opacity:.55;
  background-image:
    radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 70% 10%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 90% 60%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 35% 80%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 55% 45%,#fff 0 1px,transparent 1.5px);
  background-size:230px 190px,310px 250px,270px 220px,340px 300px,410px 360px;
  animation:starDrift 25s linear infinite;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  background:linear-gradient(transparent 50%,rgba(255,255,255,.012) 50%);
  background-size:100% 4px;
  mix-blend-mode:soft-light;
  opacity:.28;
}

@keyframes starDrift{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(-70px,50px,0)}
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

#cursorGlow{
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;
  pointer-events:none;
  z-index:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(139,92,246,.13),transparent 68%);
  filter:blur(8px);
  opacity:0;
  transition:opacity .3s ease;
}

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:45;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

/* ================= NAVBAR ================= */

.navbar{
  position:sticky;
  top:14px;
  z-index:30;
  padding-top:14px;
}

.nav-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:10px 16px 10px 12px;
  border-radius:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:900;
  letter-spacing:-.5px;
}

.brand-orb{
  width:45px;
  height:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:21px;
  background:
    radial-gradient(circle at 30% 25%,#fff,transparent 12%),
    linear-gradient(135deg,var(--primary),var(--cyan));
  box-shadow:0 0 35px rgba(139,92,246,.45);
  transform:rotate(-8deg);
}

.brand span{
  font-size:19px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:2px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-links a{
  padding:10px 13px;
  border-radius:13px;
  color:#d7d7e8;
  font-size:13px;
  transition:.25s var(--ease);
}

.nav-links a:hover{
  color:#fff;
  background:rgba(255,255,255,.07);
  transform:translateY(-2px);
}

.nav-actions{
  display:flex;
  gap:9px;
  align-items:center;
}

.icon-btn{
  position:relative;
  width:44px;
  height:44px;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  transition:.25s var(--ease);
}

.icon-btn:hover{
  transform:translateY(-3px) scale(1.03);
  border-color:rgba(192,132,252,.5);
  box-shadow:0 10px 35px rgba(139,92,246,.2);
}

.cart-count{
  position:absolute;
  top:-6px;
  left:-5px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--primary));
  border:2px solid #090914;
}

.menu-btn{display:none}

/* ================= HERO ================= */

.hero{
  min-height:680px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:40px;
  padding:70px 0 60px;
}

.hero-copy{
  position:relative;
  z-index:2;
}

.eyebrow{
  width:max-content;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  margin-bottom:20px;
  border-radius:999px;
  color:#ded8ff;
  font-size:12px;
  background:rgba(139,92,246,.1);
  border:1px solid rgba(139,92,246,.28);
}

.pulse-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#5eead4;
  box-shadow:0 0 0 5px rgba(94,234,212,.08),0 0 18px #5eead4;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(.72);opacity:.6}
}

.hero h1{
  max-width:750px;
  font-size:clamp(48px,7vw,90px);
  line-height:.95;
  letter-spacing:-4px;
  margin-bottom:23px;
}

.gradient-text{
  background:linear-gradient(90deg,#fff,#c4b5fd 35%,#67e8f9 72%,#f9a8d4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;
  color:var(--muted);
  line-height:1.9;
  font-size:16px;
  margin-bottom:28px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  min-height:49px;
  padding:0 19px;
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#fff;
  font-weight:800;
  font-size:13px;
  transition:.28s var(--ease);
  position:relative;
  overflow:hidden;
}

.btn::before{
  content:"";
  position:absolute;
  inset:-100% 40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:rotate(20deg);
  transition:.5s;
}

.btn:hover::before{inset:-100% -20%}
.btn:hover{transform:translateY(-4px)}

.btn-primary{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9 60%,#0891b2);
  box-shadow:0 15px 35px rgba(109,40,217,.32);
}

.btn-primary:hover{box-shadow:0 20px 45px rgba(109,40,217,.48)}

.btn-ghost{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
}

.hero-stats{
  display:flex;
  gap:28px;
  margin-top:38px;
  flex-wrap:wrap;
}

.stat strong{
  display:block;
  font-size:22px;
}

.stat span{
  color:#85869f;
  font-size:11px;
}

/* ================= HERO VISUAL ================= */

.hero-visual{
  min-height:500px;
  position:relative;
  display:grid;
  place-items:center;
}

.orbit{
  position:absolute;
  width:430px;
  height:430px;
  border:1px solid rgba(192,132,252,.14);
  border-radius:50%;
  animation:spin 20s linear infinite;
}

.orbit::before,
.orbit::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#c084fc;
  box-shadow:0 0 25px #c084fc;
}

.orbit::before{top:15%;right:5%}
.orbit::after{bottom:10%;left:7%;background:#22d3ee;box-shadow:0 0 25px #22d3ee}

.orbit.two{
  width:330px;
  height:330px;
  animation-duration:14s;
  animation-direction:reverse;
  border-color:rgba(34,211,238,.13);
}

.orbit.three{
  width:510px;
  height:510px;
  animation-duration:30s;
  border-color:rgba(244,114,182,.09);
}

@keyframes spin{to{transform:rotate(360deg)}}

.food-planet{
  position:relative;
  width:285px;
  height:285px;
  border-radius:50%;
  display:grid;
  place-items:center;
  z-index:2;
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.9) 0 2%,transparent 3%),
    radial-gradient(circle at 68% 30%,rgba(255,255,255,.3) 0 1%,transparent 2%),
    radial-gradient(circle at 45% 72%,rgba(255,255,255,.25) 0 1%,transparent 2%),
    linear-gradient(135deg,#ffb86b,#f97316 45%,#7c2d12);
  box-shadow:
    inset -35px -25px 55px rgba(0,0,0,.38),
    inset 20px 15px 40px rgba(255,255,255,.2),
    0 0 80px rgba(249,115,22,.18);
  animation:float 4.8s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-12px) rotate(2deg)}
}

.food-planet .emoji{
  font-size:120px;
  filter:drop-shadow(0 18px 25px rgba(0,0,0,.35));
}

.floating-chip{
  position:absolute;
  z-index:4;
  padding:10px 13px;
  border-radius:14px;
  font-size:11px;
  font-weight:800;
  background:rgba(11,11,25,.76);
  border:1px solid rgba(255,255,255,.11);
  backdrop-filter:blur(12px);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.chip-1{top:13%;right:5%;animation:float 3.7s ease-in-out infinite}
.chip-2{bottom:17%;left:2%;animation:float 4.3s ease-in-out infinite .5s}
.chip-3{top:57%;right:-2%;animation:float 4.1s ease-in-out infinite 1s}

/* ================= SECTION ================= */

.section{
  padding:75px 0;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:26px;
}

.section-title{
  font-size:clamp(29px,4vw,45px);
  letter-spacing:-1.5px;
}

.section-subtitle{
  color:var(--muted);
  max-width:540px;
  line-height:1.7;
  font-size:13px;
}

.section-kicker{
  color:#a78bfa;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

/* ================= FILTERS ================= */
    .filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.filter{
  padding:10px 14px;
  border-radius:13px;
  color:#b6b6cd;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  font-size:12px;
  transition:.25s;
}

.filter:hover,
.filter.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.1));
  border-color:rgba(167,139,250,.42);
  box-shadow:0 10px 30px rgba(139,92,246,.12);
}

/* ================= PRODUCTS ================= */

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product-card{
  position:relative;
  border-radius:24px;
  padding:10px;
  overflow:hidden;
  transition:.35s var(--ease);
  transform-style:preserve-3d;
}

.product-card:hover{
  transform:translateY(-8px);
  border-color:rgba(192,132,252,.3);
  box-shadow:0 28px 70px rgba(0,0,0,.42),0 0 35px rgba(139,92,246,.08);
}

.product-image{
  height:205px;
  border-radius:19px;
  position:relative;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 25%),
    linear-gradient(145deg,#1c1533,#0b1525);
}

.product-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 50%,rgba(0,0,0,.4));
  pointer-events:none;
}

.product-emoji{
  font-size:86px;
  filter:drop-shadow(0 20px 18px rgba(0,0,0,.45));
  transition:.35s var(--ease);
  z-index:1;
}

.product-card:hover .product-emoji{
  transform:scale(1.08) translateY(-5px) rotate(-3deg);
}

.badge{
  position:absolute;
  top:10px;
  right:10px;
  z-index:3;
  padding:6px 9px;
  border-radius:10px;
  font-size:9px;
  font-weight:900;
  background:rgba(5,5,13,.72);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
}

.product-info{padding:14px 5px 6px}
.product-name{font-size:15px;font-weight:900;margin-bottom:7px}
.product-desc{color:#898aa2;font-size:10px;line-height:1.6;min-height:33px}
.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:14px;
}

.price{
  font-weight:900;
  font-size:15px;
}

.price small{
  color:#77788e;
  font-size:9px;
  font-weight:600;
}

.add-btn{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
  box-shadow:0 8px 20px rgba(139,92,246,.24);
  transition:.25s;
}

.add-btn:hover{transform:scale(1.08) rotate(3deg)}
.add-btn:active{transform:scale(.94)}

/* ================= FEATURES ================= */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.feature{
  padding:23px;
  border-radius:22px;
  transition:.3s var(--ease);
}

.feature:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.2)}
.feature-icon{
  width:47px;
  height:47px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:21px;
  margin-bottom:17px;
  background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.1));
}
.feature h3{font-size:15px;margin-bottom:7px}
.feature p{color:#898aa2;font-size:11px;line-height:1.8}

/* ================= CART DRAWER ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.62);
  opacity:0;
  visibility:hidden;
  transition:.3s;
  backdrop-filter:blur(7px);
}

.overlay.show{opacity:1;visibility:visible}

.cart-drawer{
  position:fixed;
  z-index:100;
  top:12px;
  bottom:12px;
  left:12px;
  width:min(430px,calc(100% - 24px));
  transform:translateX(-110%);
  transition:.45s var(--ease);
  border-radius:28px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.cart-drawer.show{transform:translateX(0)}

.drawer-head{
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.drawer-title{font-size:19px;font-weight:900}
.drawer-close{
  width:38px;height:38px;border-radius:12px;
  color:#fff;background:rgba(255,255,255,.06);
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:15px;
}

.cart-empty{
  min-height:300px;
  display:grid;
  place-items:center;
  text-align:center;
  color:#77788f;
}

.empty-icon{font-size:52px;margin-bottom:10px}
.empty-text{font-size:12px}

.cart-item{
  display:grid;
  grid-template-columns:55px 1fr auto;
  gap:11px;
  align-items:center;
  padding:11px;
  margin-bottom:9px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}

.cart-thumb{
  width:55px;height:55px;border-radius:14px;
  display:grid;place-items:center;
  font-size:30px;
  background:linear-gradient(145deg,#19162d,#0b1524);
}

.cart-name{font-size:12px;font-weight:900;margin-bottom:5px}
.cart-price{font-size:10px;color:#9d9db1}
.qty-row{display:flex;align-items:center;gap:6px;margin-top:7px}
.qty-btn{
  width:23px;height:23px;border-radius:8px;
  color:#fff;background:rgba(255,255,255,.08);
}
.qty-num{font-size:10px;min-width:16px;text-align:center}
.remove-item{color:#ff91a4;font-size:10px;background:none}

.cart-summary{
  padding:17px;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.18);
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
