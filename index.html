<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الطيور السينمائي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #032820;
            color: #C5C764;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ذيل النار والمؤشر المضيء */
        .fire-trail {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #80A416;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #80A416, 0 0 30px #08652C, 0 0 45px #C5C764;
            z-index: 9999;
        }

        .trail-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #80A416 0%, #08652C 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: fadeOut 0.5s linear forwards;
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(0.2); opacity: 0; }
        }

        /* البطاقة الرئيسية لعرض الطيور (مطابقة للصورة الأصلية تماماً) */
        .gallery-card {
            position: relative;
            width: 900px;
            height: 500px;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(3, 40, 32, 0.9), 0 0 0 2px rgba(128, 164, 22, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            transition: background-image 0.6s ease-in-out;
        }

        /* طبقة التدرج الداكن (Overlay) لجعل النصوص واضحة على يسار الصورة */
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(3, 40, 32, 0.9) 0%, rgba(3, 40, 32, 0.6) 50%, rgba(3, 40, 32, 0.2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            z-index: 1;
        }

        /* قسم المعلومات على اليسار */
        .info-section {
            max-width: 400px;
            z-index: 2;
            animation: fadeInText 0.5s ease;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-section h1 {
            color: #80A416;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(128, 164, 22, 0.5);
            letter-spacing: 1px;
        }

        .info-section p {
            color: #C5C764;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .action-btn {
            background: linear-gradient(135deg, #80A416, #08652C);
            border: none;
            padding: 10px 25px;
            color: #032820;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(128, 164, 22, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(128, 164, 22, 0.8);
        }

        /* شريط الصور المصغرة (Thumbnails) في أسفل البطاقة تماماً مثل الصور المرفقة */
        .thumbnails-bar {
            display: flex;
            gap: 15px;
            z-index: 2;
            justify-content: flex-end;
            align-items: center;
        }

        .thumb-item {
            width: 75px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(128, 164, 22, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: #032820;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .thumb-item:hover, .thumb-item.active {
            border-color: #80A416;
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(128, 164, 22, 0.6);
        }
    </style>
</head>
<body>

    <!-- ذيل النار والمؤشر -->
    <div class="fire-trail" id="fireTrail"></div>

    <!-- حاوية معرض الصور السينمائي -->
    <div class="gallery-card" id="galleryCard">
        <div class="gallery-overlay">
            
            <!-- المعلومات على اليسار -->
            <div class="info-section">
                <h1 id="birdTitle">BALTIMORE ORIOLES</h1>
                <p id="birdDesc">طائر يتميز بألوانه البرتقالية والسوداء المذهلة، يتواجد في الغابات والأشجار الكثيفة ليقدم لوحة فنية ساحرة.</p>
                <button class="action-btn" onclick="alert('تمت الإضافة إلى السلة بنجاح!')">أضف إلى السلة</button>
            </div>

            <!-- الشرائح المصغرة بالأسفل -->
            <div class="thumbnails-bar" id="thumbnailsBar">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>

        </div>
    </div>

    <script>
        // حركة مؤشر النار الذكي
        const trail = document.getElementById('fireTrail');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = mouseX;
        let currentY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.pageX;
            mouseY = e.pageY;
            createParticle(e.pageX, e.pageY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('trail-particle');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 500);
        }

        function animateTrail() {
            currentX += (mouseX - currentX) * 0.2;
            currentY += (mouseY - currentY) * 0.2;
            trail.style.left = currentX + 'px';
            trail.style.top = currentY + 'px';
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        // بيانات الطيور وصورها ومعلوماتها الدقيقة
        const birdsData = [
            {
                title: "BALTIMORE ORIOLES",
                desc: "طائر يتميز بألوانه البرتقالية والسوداء المذهلة، يتواجد في الغابات والأشجار الكثيفة ليقدم لوحة فنية ساحرة.",
                img: "https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?w=1000"
            },
            {
                title: "EMERALD HUMMINGBIRD",
                desc: "طائر الطنان الزمردي المتألق بألوانه الخضراء الزاهية وقدرته الفائقة على الثبات السريع في الهواء.",
                img: "https://images.unsplash.com/photo-1522858541146-5fded364b928?w=1000"
            },
            {
                title: "VIBRANT FOREST BIRD",
                desc: "مخلوق رائع يجمع بين درجات البرتقالي والأخضر الفاتح ليتناغم مع الطبيعة الاستوائية الخلابة.",
                img: "https://images.unsplash.com/photo-1555169062-013468b476cb?w=1000"
            },
            {
                title: "BLUE JAY BIRD",
                desc: "طائر القيق الأزرق النابض بالحياة، يضفي مظهراً جمالياً رائعاً بتدرجات ألوانه النورسية المميزة.",
                img: "https://images.unsplash.com/photo-1544942507-94f7c126d409?w=1000"
            }
        ];

        const galleryCard = document.getElementById('galleryCard');
        const birdTitle = document.getElementById('birdTitle');
        const birdDesc = document.getElementById('birdDesc');
        const thumbnailsBar = document.getElementById('thumbnailsBar');

        // دالة عرض الطائر وتغيير الخلفية والمعلومات
        function selectBird(index) {
            galleryCard.style.backgroundImage = url('${birdsData[index].img}');
            birdTitle.innerText = birdsData[index].title;
            birdDesc.innerText = birdsData[index].desc;

            // تحديث الكارت النشط في الشريط السفلي
            const thumbs = document.querySelectorAll('.thumb-item');
            thumbs.forEach((th, idx) => {
                if (idx === index) {
                    th.classList.add('active');
                } else {
                    th.classList.remove('active');
                }
            });
        }

        // بناء الـ Thumbnails تلقائياً في الأسفل
        function initGallery() {
            thumbnailsBar.innerHTML = '';
            birdsData.forEach((bird, index) => {
                thumbnailsBar.innerHTML += `
                    <div class="thumb-item ${index === 0 ? 'active' : ''}" onclick="selectBird(${index})">
                        <img src="${bird.img}" alt="${bird.title}">
                    </div>
                `;
            });
            selectBird(0); // البدء بالعنصر الأول
        }

        initGallery();
    </script>
</body>
</html>
