<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام السينمائي الأخضر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #032820; /* اللون الأخضر الداكن الأساسي من باليت الصور */
            color: #C5C764;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* حبل النار والمؤشر المتحرك */
        .fire-trail {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #80A416;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #80A416, 0 0 30px #08652C, 0 0 45px #C5C764;
            z-index: 9999;
        }

        .trail-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #80A416 0%, #08652C 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: fadeOut 0.5s linear forwards;
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(0.2); opacity: 0; }
        }

        /* البطاقة الرئيسية لتسجيل الدخول (مطابقة للصورة الأولى) */
        .main-card {
            position: relative;
            width: 850px;
            height: 480px;
            background: rgba(8, 101, 44, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(128, 164, 22, 0.4);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(3, 40, 32, 0.8), inset 0 0 25px rgba(128, 164, 22, 0.15);
            display: flex;
            overflow: hidden;
            transition: all 0.8s ease;
        }

        .card-left {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 25px;
            border-left: 1px solid rgba(128, 164, 22, 0.2);
        }

        /* اللمبة الخضراء تماماً مثل الصورة الأولى */
        .lamp-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            transition: transform 0.2s;
        }

        .lamp-container:hover {
            transform: scale(1.05);
        }

        .lamp {
            width: 75px;
            height: 45px;
            background: #08652C;
            border: 2px solid #80A416;
            border-radius: 0 0 50% 50%;
            position: relative;
            box-shadow: 0 0 30px #80A416, inset 0 0 10px #C5C764;
        }

        .lamp::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 24px;
            width: 23px;
            height: 25px;
            background: #80A416;
        }

        /* مخروط الضوء الأخضر المتدفق */
        .light-beam {
            position: absolute;
            top: 60px;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 340px solid rgba(128, 164, 22, 0.18);
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 20px rgba(128, 164, 22, 0.3));
        }

        /* الروبوت الأخضر المطابق للصورة الأولى (مخفي مبدئياً لحين الضغط على اللمبة) */
        .robot-circle {
            position: absolute;
            bottom: 45px;
            width: 85px;
            height: 85px;
            background: #032820;
            border: 2px solid #80A416;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 25px #80A416;
            z-index: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .robot-circle.show {
            opacity: 1;
            transform: scale(1);
        }

        .robot-eye {
            width: 12px;
            height: 16px;
            background: #C5C764;
            border-radius: 50%;
            box-shadow: 0 0 10px #C5C764;
        }

        /* خانة تسجيل الدخول (تظهر تدريجياً بعد الروبوت) */
        .card-right {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.6s ease 0.3s;
        }

        .card-right.show {
            opacity: 1;
            transform: translateX(0);
        }

        .card-right h2 {
            color: #80A416;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .card-right p {
            color: #C5C764;
            font-size: 13px;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #C5C764;
            margin-bottom: 5px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px 15px;
            background: #032820;
            border: 1px solid #08652C;
            border-radius: 8px;
            color: #C5C764;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #80A416;
            box-shadow: 0 0 10px rgba(128, 164, 22, 0.4);
        }

        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #80A416, #08652C);
            border: none;
            border-radius: 8px;
            color: #032820;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(128, 164, 22, 0.6);
        }

        .error-msg {
            color: #ff5722;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* واجهة المتجر والشرائح التفاعلية (بعد تسجيل الدخول الناجح) */
        #mainStore {
            display: none;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 0.8s ease-in-out;
        }

        .store-overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 40, 32, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .content-display {
            max-width: 600px;
            margin-top: 40px;
            animation: fadeInContent 0.8s ease;
        }

        @keyframes fadeInContent {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-display h1 {
            color: #80A416;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(128, 164, 22, 0.4);
        }

        .content-display p {
            color: #C5C764;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, #80A416, #08652C);
            border: none;
            padding: 12px 30px;
            color: #032820;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(128, 164, 22, 0.4);
            transition: transform 0.2s;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.05);
        }

        /* الشرائح المصغرة بالأسفل (Thumbnail Slider Cards) */
        .thumbnails-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .thumb-card {
            width: 110px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(128, 164, 22, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: #032820;
            flex-shrink: 0;
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: #80A416;
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(128, 164, 22, 0.4);
        }
    </style>
</head>
<body>

    <!-- حبل النار والمؤشر -->
    <div class="fire-trail" id="fireTrail"></div>

    <!-- البطاقة الأولى (تسجيل الدخول واللمبة والروبوت) -->
    <div class="main-card" id="loginCardContainer">
        <div class="card-left">
            <!-- الضغط على اللمبة يبدأ العرض السينمائي -->
            <div class="lamp-container" onclick="revealElements()">
                <div class="lamp"></div>
            </div>
            <div class="light-beam"></div>
            
            <!-- الروبوت الأخضر -->
            <div class="robot-circle" id="robotElement">
                <div class="robot-eye"></div>
                <div class="robot-eye"></div>
            </div>
        </div>

        <div class="card-right" id="rightSection">
            <h2>Welcome Back.</h2>
            <p>Pull the cord to illuminate your path & sign in</p>
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" id="username" placeholder="اكتب hany">
            </div>
            
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="اكتب 12345678900">
            </div>

            <button class="sign-in-btn" onclick="handleLogin()">SIGN IN →</button>
            <div class="error-msg" id="errorMsg">البيانات غير صحيحة، حاول مجدداً!</div>
        </div>
    </div>

    <!-- واجهة المتجر التفاعلية بالصور (تظهر بعد تسجيل الدخول) -->
    <div id="mainStore">
        <div class="store-overlay">
            <div class="content-display" id="contentDisplay">
                <h1 id="itemTitle">عنصر رقم 1</h1>
                <p id="itemDesc">هذه معلومات تفصيلية عن العنصر الأول، تم اختيار الصورة بعناية لتناسب الألوان والتصميم الأخضر الساحر.</p>
                <button class="add-to-cart-btn" onclick="alert('تمت الإضافة إلى السلة بنجاح!')">أضف إلى السلة</button>
            </div>

            <div class="thumbnails-container" id="thumbnailsContainer">
                <!-- سيتم تعبئة الصور الـ 10 هنا برمجياً -->
            </div>
        </div>
    </div>

    <script>
        // حركة ذيل حبل النار للمؤشر
        const trail = document.getElementById('fireTrail');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = mouseX;
        let currentY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.pageX;
            mouseY = e.pageY;
            createParticle(e.pageX, e.pageY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('trail-particle');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 500);
        }

        function animateTrail() {
            currentX += (mouseX - currentX) * 0.2;
            currentY += (mouseY - currentY) * 0.2;
            trail.style.left = currentX + 'px';
            trail.style.top = currentY + 'px';
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        // تتابع ظهور العناصر عند النقر على اللمبة
        let isRevealed = false;
        function revealElements() {
            if (isRevealed) return;
            isRevealed = true;

            const robot = document.getElementById('robotElement');
            const rightSec = document.getElementById('rightSection');

            // 1. يظهر الروبوت الأخضر أولاً
            robot.classList.add('show');

            // 2. بعد جزء من الثانية تظهر خانة تسجيل الدخول من الناحية الأخرى
            setTimeout(() => {
                rightSec.classList.add('show');
            }, 300);
        }

        // بيانات الصور الـ 10 (طيور وطبيعة خلابة متناسقة مع الألوان)
        const items = [
            { title: "البلشون الأزرق البديع", desc: "طائر نادر يتميز بريشه الأزرق الخلاب وتواجده الهادئ وسط الطبيعة الخضراء.", img: "https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=1000" },
            { title: "الهدهد الملكي", desc: "طائر ذو تاج مميز وألوان ترعاه الطبيعة بجمال فريد وداكن متناسق.", img: "https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?w=1000" },
            { title: "طائر القيق الأزرق", desc: "يتألق بريش أزرق ورمادي ناصع يمنح إضاءة رائعة للخلفية.", img: "https://images.unsplash.com/photo-1544942507-94f7c126d409?w=1000" },
            { title: "العصفور الذهبي المغرد", desc: "ألوان برتقالية وذهبية مميزة تتماشى بانسجام تام مع درجات الإضاءة.", img: "https://images.unsplash.com/photo-1555169062-013468b476cb?w=1000" },
            { title: "صقر الغابات الخضراء", desc: "نظرة حادة وحضور قوي يتماشى مع أجواء الروبوت والغموض السينمائي.", img: "https://images.unsplash.com/photo-1611689342806-0863700ce1e4?w=1000" },
            { title: "طائر الطنان الزمردي", desc: "ألوان متلألئة تتدرج بين الأخضر والأزرق الساحر.", img: "https://images.unsplash.com/photo-1522858541146-5fded364b928?w=1000" },
            { title: "بومة الليل العميقة", desc: "عيون براقة تسحر اللحظة وتتناسق مع خلفيات النظام الداكنة.", img: "https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=1000" },
            { title: "الطائر الناري المضيء", desc: "طائر يجمع بين درجات النحاسي والأخضر الداكن.", img: "https://images.unsplash.com/photo-1444464666168-49d633b86797?w=1000" },
            { title: "طائر الغابة المطيرة", desc: "بيئة طبيعية خضراء متكاملة تعزز هوية الموقع البصرية.", img: "https://images.unsplash.com/photo-1518992028580-ec6db7f22687?w=1000" },
            { title: "طائر البجع الهادئ", desc: "صفاء ونقاء يختتم قائمة العناصر بجمال هندسي مبهر.", img: "https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?w=1000" }
        ];

        // دالة التحقق من بيانات الدخول والانتقال للمتجر
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'hany' && pass === '12345678900') {
                document.getElementById('loginCardContainer').style.display = 'none';
                const store = document.getElementById('mainStore');
                store.style.display = 'block';

                // تعيين الصورة الأولى افتراضياً
                changeBackground(0);

                // توليد الـ 10 صور في الشريط السفلي (Thumbnails)
                const container = document.getElementById('thumbnailsContainer');
                container.innerHTML = '';
                items.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="thumb-card ${index === 0 ? 'active' : ''}" onclick="changeBackground(${index})">
                            <img src="${item.img}" alt="${item.title}">
                        </div>
                    `;
                });
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // دالة تغيير الخلفية والمعلومات عند النقر على أي صورة في الشرائح
        function changeBackground(index) {
            const store = document.getElementById('mainStore');
            store.style.backgroundImage = url('${items[index].img}');
            
            document.getElementById('itemTitle').innerText = items[index].title;
            document.getElementById('itemDesc').innerText = items[index].desc;

            // تحديث حالة التحديد (Active Card)
            const cards = document.querySelectorAll('.thumb-card');
            cards.forEach((card, idx) => {
                if (idx === index) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
