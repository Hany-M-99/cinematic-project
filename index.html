<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعرض السينمائي الذكي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #051822; /* اللون الداكن الأساسي من الباليت */
            color: #D4C9C7; /* اللون الفاتح للنصوص */
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ذيل النار والمؤشر المتحرك */
        .fire-trail {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #AA7452;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #AA7452, 0 0 30px #7C5841, 0 0 45px #ff5722;
            z-index: 9999;
            transition: transform 0.05s ease-out;
        }

        .trail-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #AA7452 0%, #7C5841 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: fadeOut 0.6s linear forwards;
        }

        @keyframes fadeOut {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }
            100% {
                transform: scale(0.2);
                opacity: 0;
            }
        }

        /* الواجهة الأولى - السينمائية */
        #introSection {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            transition: opacity 1s ease;
        }

        /* اللمبة والحبل */
        .lamp-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        .wire {
            width: 3px;
            height: 120px;
            background: #969A9E;
            transition: height 0.3s ease;
        }

        .bulb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bulb {
            width: 50px;
            height: 60px;
            background: #2D383E;
            border: 2px solid #969A9E;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            transition: all 0.4s ease;
        }

        /* حالة اللمبة منورة بلون دافئ متناسق */
        .bulb.on {
            background: #AA7452;
            border-color: #D4C9C7;
            box-shadow: 0 0 40px #AA7452, 0 0 80px #7C5841, inset 0 0 15px #D4C9C7;
        }

        /* مخروط النور تحت اللمبة */
        .light-beam {
            position: absolute;
            top: 180px;
            width: 0px;
            height: 0px;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 0px solid rgba(170, 116, 82, 0);
            transition: all 0.8s ease;
            pointer-events: none;
            z-index: 2;
        }

        .light-beam.active {
            border-top: 360px solid rgba(170, 116, 82, 0.15);
            filter: drop-shadow(0 0 25px rgba(124, 88, 65, 0.3));
        }

        /* محتوى العرض تحت النور (الروبوت وخانة تسجيل الدخول) */
        .stage-container {
            position: absolute;
            top: 250px;
            display: flex;
            gap: 50px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .stage-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* تصميم الروبوت بالوان الباليت */
        .robot {
            width: 120px;
            height: 160px;
            background: #2D383E;
            border: 2px solid #AA7452;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            position: relative;
            box-shadow: 0 0 20px rgba(170, 116, 82, 0.3);
            transition: transform 0.4s ease;
        }

        .robot-head {
            width: 70px;
            height: 50px;
            background: #051822;
            border: 2px solid #7C5841;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .robot-eye {
            width: 12px;
            height: 12px;
            background: #AA7452;
            border-radius: 50%;
            box-shadow: 0 0 8px #AA7452;
            transition: transform 0.3s ease;
        }

        .robot-body {
            width: 90px;
            height: 70px;
            background: #051822;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #2D383E;
        }

        .robot-core {
            width: 25px;
            height: 25px;
            background: #7C5841;
            border-radius: 50%;
            box-shadow: 0 0 10px #7C5841;
        }

        /* صندوق تسجيل الدخول (ديناميكي) */
        .login-card {
            background: rgba(45, 56, 62, 0.85);
            border: 1px solid #7C5841;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(124, 88, 65, 0.3);
            width: 320px;
            transform: translateX(100px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s;
        }

        .stage-container.show .login-card {
            transform: translateX(0);
            opacity: 1;
        }

        .login-card h2 {
            color: #AA7452;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #969A9E;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #051822;
            border: 1px solid #2D383E;
            border-radius: 6px;
            color: #D4C9C7;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #AA7452;
            box-shadow: 0 0 8px rgba(170, 116, 82, 0.4);
        }

        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #AA7452, #7C5841);
            border: none;
            border-radius: 6px;
            color: #D4C9C7;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(170, 116, 82, 0.6);
        }

        .error-msg {
            color: #ff5722;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* واجهة المتجر الداخلية (بعد الدخول الناجح) */
        #mainStore {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 40px;
            background: #051822;
        }

        #mainStore h1 {
            color: #AA7452;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(170, 116, 82, 0.4);
        }

.store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: #2D383E;
            border: 1px solid #7C5841;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #AA7452;
        }

        .product-card h3 {
            color: #D4C9C7;
            margin-bottom: 10px;
        }

        .product-card p {
            color: #AA7452;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ذيل حبل النار للمؤشر -->
    <div class="fire-trail" id="fireTrail"></div>

    <!-- الواجهة السينمائية الأولى -->
    <div id="introSection">
        <!-- اللمبة والحبل -->
        <div class="lamp-container" id="lampContainer" onclick="toggleLight()">
            <div class="wire" id="wireElement"></div>
            <div class="bulb-wrapper">
                <div class="bulb" id="bulbElement"></div>
            </div>
        </div>

        <!-- مخروط الضوء -->
        <div class="light-beam" id="lightBeam"></div>

        <!-- المسرح (الروبوت وخانة تسجيل الدخول) -->
        <div class="stage-container" id="stageContainer">
            <!-- الروبوت -->
            <div class="robot" id="robotElement">
                <div class="robot-head">
                    <div class="robot-eye" id="leftEye"></div>
                    <div class="robot-eye" id="rightEye"></div>
                </div>
                <div class="robot-body">
                    <div class="robot-core"></div>
                </div>
            </div>

            <!-- خانة تسجيل الدخول -->
            <div class="login-card">
                <h2>تسجيل الدخول</h2>
                <div class="input-group">
                    <label>اسم المستخدم (Username)</label>
                    <input type="text" id="username" placeholder="اكتب hany">
                </div>
                <div class="input-group">
                    <label>كلمة المرور (Password)</label>
                    <input type="password" id="password" placeholder="اكتب 12345678900">
                </div>
                <button class="sign-in-btn" onclick="handleLogin()">Sign In</button>
                <div class="error-msg" id="errorMsg">البيانات غير صحيحة، حاول مجدداً!</div>
            </div>
        </div>
    </div>

    <!-- واجهة المتجر الداخلية -->
    <div id="mainStore">
        <h1>أهلاً بك يا فنان في الواجهة الرئيسية!</h1>
        <div class="store-grid" id="productsGrid">
            <!-- سيتم توليد المنتجات هنا جافاسكريبت -->
        </div>
    </div>

    <script>
        // حركة ذيل حبل النار للمؤشر (يعمل أثناء الحركة والوقوف)
        const trail = document.getElementById('fireTrail');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = mouseX;
        let currentY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.pageX;
            mouseY = e.pageY;
            
            // إضافة جسيمات نارية صغيرة تسير خلف المؤشر
            createParticle(e.pageX, e.pageY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('trail-particle');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 600);
        }

        // حلقة التنعيم لحركة حبل النار
        function animateTrail() {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            trail.style.left = currentX + 'px';
            trail.style.top = currentY + 'px';
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        let isLightOn = false;

        // دالة تشغيل وإطفاء اللمبة بشد الحبل
        function toggleLight() {
            isLightOn = !isLightOn;
            const bulb = document.getElementById('bulbElement');
            const beam = document.getElementById('lightBeam');
            const stage = document.getElementById('stageContainer');
            const wire = document.getElementById('wireElement');
            const leftEye = document.getElementById('leftEye');
            const rightEye = document.getElementById('rightEye');

            // تأثير شد الحبل البسيط
            wire.style.height = isLightOn ? '140px' : '120px';
            setTimeout(() => {
                wire.style.height = '120px';
            }, 200);

            if (isLightOn) {
                bulb.classList.add('on');
                beam.classList.add('active');
                
                // إظهار الروبوت وخانة الدخول بحركة سينمائية تدريجية
                setTimeout(() => {
                    stage.classList.add('show');
                    // الروبوت ينظر يميناً ناحية خانة تسجيل الدخول
                    setTimeout(() => {
                        leftEye.style.transform = 'translateX(3px)';
                        rightEye.style.transform = 'translateX(3px)';
                    }, 500);
                }, 400);

            } else {
                bulb.classList.remove('on');
                beam.classList.remove('active');
                stage.classList.remove('show');
                // إرجاع عيون الروبوت للوضع الطبيعي
                leftEye.style.transform = 'translateX(0)';
                rightEye.style.transform = 'translateX(0)';
            }
        }

        // دالة التحقق من بيانات الدخول
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'hany' && pass === '12345678900') {
                document.getElementById('introSection').style.display = 'none';
                const store = document.getElementById('mainStore');
                store.style.display = 'block';

                // توليد المنتجات التجريبية الداخلية
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';
                for (let i = 1; i <= 10; i++) {
                    grid.innerHTML += `
                        <div class="product-card">
                            <h3>منتج رقم ${i}</h3>
                            <p>$${i * 18}.00</p>
                        </div>
                    `;
                }
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
